# Perfil de tests: H2 en memoria en modo MySQL, con las mismas migraciones de Flyway.
spring:
  datasource:
    url: jdbc:h2:mem:justa;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

justa:
  jwt:
    secreto: secreto-solo-para-tests-0123456789-abcdefghij
  # Los tests nunca llaman a las APIs reales aunque exista backend/.env
  proveedor:
    api-key: ""
  historial:
    api-key: ""
  the-sports-db:
    api-key: ""
  admin:
    clave: ""
  precalculo:
    activo: false
  # Sin tareas programadas: al arrancar no se baja nada de ESPN ni de football-data.co.uk
  sync:
    programado: false
